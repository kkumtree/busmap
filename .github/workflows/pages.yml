name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html style.css app.js api.js journey.js targeted.js plan-model.js map-style.json .nojekyll _site/
          cp route-geometry.js shape-cache.js network-view.js _site/
          mkdir _site/data
          cp data/focus-plan.json data/apartment-labels.geojson data/dong-labels.geojson _site/data/
          cp -r vendor _site/
          node scripts/stamp-assets.mjs _site "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
